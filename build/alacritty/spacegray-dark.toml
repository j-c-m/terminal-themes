# Theme:    Spacegray Dark
# Mode:     dark
# Source:   Spacegray (https://github.com/SublimeText/Spacegray/)

# Default colors
[colors.primary]
background  = '#2b303b'
foreground  = '#c0c5ce'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#2b303b'
cursor      = '#c0c5ce'

# Selection colors
[colors.selection]
background  = '#c0c5ce'
text        = '#2b303b'

# Normal colors
[colors.normal]
black       = '#343d46'
red         = '#bf616a'
green       = '#a3be8c'
yellow      = '#ab7967'
blue        = '#8fa1b3'
magenta     = '#b48ead'
cyan        = '#96b5b4'
white       = '#c0c5ce'

# Bright colors
[colors.bright]
black       = '#65737e'
red         = '#c7757d'
green       = '#b4caa1'
yellow      = '#ebcb8b'
blue        = '#a2b1c0'
magenta     = '#c1a1bb'
cyan        = '#a9c3c2'
white       = '#eff1f5'
