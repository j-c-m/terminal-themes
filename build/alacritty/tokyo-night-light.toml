# Theme:    Tokyo Night Light
# Mode:     light
# Source:   Tokyo Night (https://github.com/tokyo-night/)

# Default colors
[colors.primary]
background  = '#e6e7ed'
foreground  = '#343b58'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#343b58'
red         = '#8c4351'
green       = '#385f0d'
yellow      = '#8f5e15'
blue        = '#2959aa'
magenta     = '#5a3e8e'
cyan        = '#0f4b6e'
white       = '#343b58'

# Bright colors
[colors.bright]
black       = '#6c6e75'
red         = '#8c4351'
green       = '#385f0d'
yellow      = '#8f5e15'
blue        = '#2959aa'
magenta     = '#5a3e8e'
cyan        = '#0f4b6e'
white       = '#343b58'
