# Theme:    Tokyo Night Light
# Mode:     light
# Source:   Tokyo Night (https://github.com/tokyo-night/)

# Default colors
[colors.primary]
background  = '#e6e7ed'
foreground  = '#343b58'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#e6e7ed'
cursor      = '#343b58'

# Selection colors
[colors.selection]
background  = '#343b58'
text        = '#e6e7ed'

# Normal colors
[colors.normal]
black       = '#343b58'
red         = '#8c4351'
green       = '#385f0d'
yellow      = '#8f5e15'
blue        = '#2959aa'
magenta     = '#5a3e8e'
cyan        = '#0f4b6e'
white       = '#343b58'

# Bright colors
[colors.bright]
black       = '#6c6e75'
red         = '#9a4a59'
green       = '#3e690e'
yellow      = '#9d6717'
blue        = '#2d62bb'
magenta     = '#63449c'
cyan        = '#105279'
white       = '#343b58'
