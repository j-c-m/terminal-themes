# Theme:    Gruvbox Dark Medium
# Mode:     dark
# Source:   Gruvbox (https://github.com/morhetz/gruvbox)

# Default colors
[colors.primary]
background  = '#282828'
foreground  = '#ebdbb2'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#282828'
cursor      = '#ebdbb2'

# Selection colors
[colors.selection]
background  = '#ebdbb2'
text        = '#282828'

# Normal colors
[colors.normal]
black       = '#282828'
red         = '#cc241d'
green       = '#98971a'
yellow      = '#d79921'
blue        = '#458588'
magenta     = '#b16286'
cyan        = '#689d6a'
white       = '#d5c4a1'

# Bright colors
[colors.bright]
black       = '#928374'
red         = '#fb4934'
green       = '#b8bb26'
yellow      = '#fabd2f'
blue        = '#83a598'
magenta     = '#d3869b'
cyan        = '#8ec07c'
white       = '#ebdbb2'
