# Theme:    Solarized Light
# Mode:     light
# Source:   Solarized (https://github.com/altercation/solarized/)

# Default colors
[colors.primary]
background  = '#fdf6e3'
foreground  = '#657b83'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#073642'
red         = '#dc322f'
green       = '#859900'
yellow      = '#cb4b16'
blue        = '#268bd2'
magenta     = '#6c71c4'
cyan        = '#2aa198'
white       = '#93a1a1'

# Bright colors
[colors.bright]
black       = '#586e75'
red         = '#dc322f'
green       = '#859900'
yellow      = '#b58900'
blue        = '#268bd2'
magenta     = '#d33682'
cyan        = '#2aa198'
white       = '#fdf6e3'
