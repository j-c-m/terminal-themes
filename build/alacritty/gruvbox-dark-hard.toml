# Theme:    Gruvbox Dark Hard
# Mode:     dark
# Source:   https://github.com/morhetz/gruvbox-contrib/blob/master/color.table

# Default colors
[colors.primary]
background  = '#1d2021'
foreground  = '#ebdbb2'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#1d2021'
red         = '#cc241d'
green       = '#98971a'
yellow      = '#d79921'
blue        = '#458588'
magenta     = '#b16286'
cyan        = '#689d6a'
white       = '#a89984'

# Bright colors
[colors.bright]
black       = '#928374'
red         = '#fb4934'
green       = '#b8bb26'
yellow      = '#fabd2f'
blue        = '#83a598'
magenta     = '#d3869b'
cyan        = '#8ec07c'
white       = '#ebdbb2'
