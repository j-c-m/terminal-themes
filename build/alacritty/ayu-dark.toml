# Theme:    Ayu Dark
# Mode:     dark
# Source:   https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-dark.json https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-light.json

# Default colors
[colors.primary]
background  = '#0d1017'
foreground  = '#bfbdb6'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#0d1017'
cursor      = '#e6b450'

# Selection colors
[colors.selection]
background  = '#3388ff'
text        = '#0d1017'

# Normal colors
[colors.normal]
black       = '#1b1f29'
red         = '#f06b73'
green       = '#70bf56'
yellow      = '#fdb04c'
blue        = '#4fbfff'
magenta     = '#d0a1ff'
cyan        = '#93e2c8'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f07178'
green       = '#aad94c'
yellow      = '#ffb454'
blue        = '#59c2ff'
magenta     = '#d2a6ff'
cyan        = '#95e6cb'
white       = '#ffffff'
