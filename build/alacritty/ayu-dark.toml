# Theme:    Ayu Dark
# Mode:     dark
# Source:   Ayu Theme (https://github.com/ayu-theme)

# Default colors
[colors.primary]
background  = '#0b0e14'
foreground  = '#bfbdb6'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#0b0e14'
cursor      = '#e6b450'

# Selection colors
[colors.selection]
background  = '#409fff'
text        = '#0b0e14'

# Normal colors
[colors.normal]
black       = '#11151c'
red         = '#ea6c73'
green       = '#7fd962'
yellow      = '#f9af4f'
blue        = '#53bdfa'
magenta     = '#cda1fa'
cyan        = '#90e1c6'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f07178'
green       = '#aad94c'
yellow      = '#ffb454'
blue        = '#59c2ff'
magenta     = '#d2a6ff'
cyan        = '#95e6cb'
white       = '#ffffff'
