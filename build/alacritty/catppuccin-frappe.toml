# Theme:    Catppuccin Frappe
# Mode:     dark
# Source:   https://github.com/catppuccin/palette/blob/main/palette.json

# Default colors
[colors.primary]
background  = '#303446'
foreground  = '#c6d0f5'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#232634'
cursor      = '#f2d5cf'

# Selection colors
[colors.selection]
background  = '#414559'
text        = '#c6d0f5'

# Normal colors
[colors.normal]
black       = '#51576d'
red         = '#e78284'
green       = '#a6d189'
yellow      = '#e5c890'
blue        = '#8caaee'
magenta     = '#f4b8e4'
cyan        = '#81c8be'
white       = '#a5adce'

# Bright colors
[colors.bright]
black       = '#626880'
red         = '#e67172'
green       = '#8ec772'
yellow      = '#d9ba73'
blue        = '#7b9ef0'
magenta     = '#f2a4db'
cyan        = '#5abfb5'
white       = '#b5bfe2'
