# Default colors
[colors.primary]
background  = '#eff1f5'
foreground  = '#4c4f69'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#eff1f5'
cursor      = '#dc8a78'

# Selection colors
[colors.selection]
background  = '#dc8a78'
text        = '#eff1f5'

# Normal colors
[colors.normal]
black       = '#bcc0cc'
red         = '#d20f39'
green       = '#40a02b'
yellow      = '#df8e1d'
blue        = '#1e66f5'
magenta     = '#ea76cb'
cyan        = '#179299'
white       = '#5c5f77'

# Bright colors
[colors.bright]
black       = '#acb0be'
red         = '#e7103f'
green       = '#46b02f'
yellow      = '#e49931'
blue        = '#3878f6'
magenta     = '#ef95d7'
cyan        = '#19a1a8'
white       = '#6c6f85'
