# Theme:    Catppuccin Macchiato
# Mode:     dark
# Source:   Catppuccin (https://github.com/catppuccin/)
# License:  MIT

# Default colors
[colors.primary]
background  = '#24273a'
foreground  = '#cad3f5'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#24273a'
cursor      = '#f4dbd6'

# Selection colors
[colors.selection]
background  = '#f4dbd6'
text        = '#24273a'

# Normal colors
[colors.normal]
black       = '#494d64'
red         = '#ed8796'
green       = '#a6da95'
yellow      = '#eed49f'
blue        = '#8aadf4'
magenta     = '#f5bde6'
cyan        = '#8bd5ca'
white       = '#b8c0e0'

# Bright colors
[colors.bright]
black       = '#5b6078'
red         = '#f2a7b2'
green       = '#bde3b0'
yellow      = '#f4e3c1'
blue        = '#adc5f7'
magenta     = '#f493da'
cyan        = '#a5ded6'
white       = '#a5adcb'
