# Theme:    IBM 5153 CGA
# Mode:     dark
# Source:   int10h.org (https://int10h.org/blog/2022/06/ibm-5153-color-true-cga-palette/)

# Default colors
[colors.primary]
background  = '#141414'
foreground  = '#cecece'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#141414'
cursor      = '#cecece'

# Selection colors
[colors.selection]
background  = '#cecece'
text        = '#141414'

# Normal colors
[colors.normal]
black       = '#141414'
red         = '#d03333'
green       = '#1bd01b'
yellow      = '#d08c1b'
blue        = '#1b1bd0'
magenta     = '#d01bd0'
cyan        = '#1bd0d0'
white       = '#cecece'

# Bright colors
[colors.bright]
black       = '#4e4e4e'
red         = '#dc4e4e'
green       = '#4edc4e'
yellow      = '#f3f34e'
blue        = '#4e4edc'
magenta     = '#f34ef3'
cyan        = '#4ef3f3'
white       = '#ffffff'
