# Theme:    Selenized Light
# Mode:     light
# Source:   Jan Warchol (https://github.com/jan-warchol/selenized)

# Default colors
[colors.primary]
background  = '#fbf3db'
foreground  = '#53676d'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#fbf3db'
cursor      = '#8762c6'

# Selection colors
[colors.selection]
background  = '#53676d'
text        = '#fbf3db'

# Normal colors
[colors.normal]
black       = '#ece3cc'
red         = '#d2212d'
green       = '#489100'
yellow      = '#ad8900'
blue        = '#0072d4'
magenta     = '#ca4898'
cyan        = '#009c8f'
white       = '#53676d'

# Bright colors
[colors.bright]
black       = '#909995'
red         = '#cc1729'
green       = '#428b00'
yellow      = '#a78300'
blue        = '#006dce'
magenta     = '#c44392'
cyan        = '#00978a'
white       = '#3a4d53'
