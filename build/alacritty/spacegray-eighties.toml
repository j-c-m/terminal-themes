# Theme:    Spacegray Eighties
# Mode:     dark
# Source:   Spacegray (https://github.com/SublimeText/Spacegray/)

# Default colors
[colors.primary]
background  = '#2d2d2d'
foreground  = '#d3d0c8'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#2d2d2d'
cursor      = '#d3d0c8'

# Selection colors
[colors.selection]
background  = '#d3d0c8'
text        = '#2d2d2d'

# Normal colors
[colors.normal]
black       = '#393939'
red         = '#f2777a'
green       = '#99cc99'
yellow      = '#d27b53'
blue        = '#6699cc'
magenta     = '#cc99cc'
cyan        = '#66cccc'
white       = '#d3d0c8'

# Bright colors
[colors.bright]
black       = '#747369'
red         = '#f5989a'
green       = '#b1d8b1'
yellow      = '#ffcc66'
blue        = '#7da8d4'
magenta     = '#d8b1d8'
cyan        = '#7dd4d4'
white       = '#f2f0ec'
