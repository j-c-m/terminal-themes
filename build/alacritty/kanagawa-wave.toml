# Theme:    Kanagawa Wave
# Mode:     dark
# Source:   Kanagawa (https://github.com/rebelot/kanagawa)

# Default colors
[colors.primary]
background  = '#1f1f28'
foreground  = '#dcd7ba'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#1f1f28'
cursor      = '#dcd7ba'

# Selection colors
[colors.selection]
background  = '#2d4f67'
text        = '#c8c093'

# Normal colors
[colors.normal]
black       = '#090618'
red         = '#c34043'
green       = '#76946a'
yellow      = '#c0a36e'
blue        = '#7e9cd8'
magenta     = '#957fb8'
cyan        = '#6a9589'
white       = '#c8c093'

# Bright colors
[colors.bright]
black       = '#727169'
red         = '#e82424'
green       = '#98bb6c'
yellow      = '#e6c384'
blue        = '#7fb4ca'
magenta     = '#938aa9'
cyan        = '#7aa89f'
white       = '#dcd7ba'
