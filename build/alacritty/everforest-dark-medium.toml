# Theme:    Everforest Dark Medium
# Mode:     dark
# Source:   https://github.com/sainnhe/everforest/blob/master/palette.md

# Default colors
[colors.primary]
background  = '#2d353b'
foreground  = '#d3c6aa'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#2d353b'
red         = '#e67e80'
green       = '#a7c080'
yellow      = '#dbbc7f'
blue        = '#7fbbb3'
magenta     = '#d699b6'
cyan        = '#83c092'
white       = '#d3c6aa'

# Bright colors
[colors.bright]
black       = '#7a8478'
red         = '#e67e80'
green       = '#a7c080'
yellow      = '#dbbc7f'
blue        = '#7fbbb3'
magenta     = '#d699b6'
cyan        = '#83c092'
white       = '#fdf6e3'
