# Theme:    Selenized Dark
# Mode:     dark
# Source:   Jan Warchol (https://github.com/jan-warchol/selenized)

# Default colors
[colors.primary]
background  = '#103c48'
foreground  = '#adbcbc'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#103c48'
cursor      = '#af88eb'

# Selection colors
[colors.selection]
background  = '#adbcbc'
text        = '#103c48'

# Normal colors
[colors.normal]
black       = '#184956'
red         = '#fa5750'
green       = '#75b938'
yellow      = '#dbb32d'
blue        = '#4695f7'
magenta     = '#f275be'
cyan        = '#41c7b9'
white       = '#adbcbc'

# Bright colors
[colors.bright]
black       = '#72898f'
red         = '#ff665c'
green       = '#84c747'
yellow      = '#ebc13d'
blue        = '#58a3ff'
magenta     = '#ff84cd'
cyan        = '#53d6c7'
white       = '#cad8d9'
