# Theme:    Gruvbox Dark Soft
# Mode:     dark
# Source:   https://github.com/morhetz/gruvbox-contrib/blob/master/color.table

# Default colors
[colors.primary]
background  = '#32302f'
foreground  = '#ebdbb2'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#32302f'
cursor      = '#ebdbb2'

# Selection colors
[colors.selection]
background  = '#ebdbb2'
text        = '#32302f'

# Normal colors
[colors.normal]
black       = '#32302f'
red         = '#cc241d'
green       = '#98971a'
yellow      = '#d79921'
blue        = '#458588'
magenta     = '#b16286'
cyan        = '#689d6a'
white       = '#a89984'

# Bright colors
[colors.bright]
black       = '#928374'
red         = '#fb4934'
green       = '#b8bb26'
yellow      = '#fabd2f'
blue        = '#83a598'
magenta     = '#d3869b'
cyan        = '#8ec07c'
white       = '#ebdbb2'
