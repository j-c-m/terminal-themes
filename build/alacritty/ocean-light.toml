# Theme:    Ocean Light
# Mode:     light
# Source:   Spacegray (https://github.com/SublimeText/Spacegray/)

# Default colors
[colors.primary]
background  = '#eff1f5'
foreground  = '#4f5b66'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#dfe1e8'
red         = '#c85863'
green       = '#6f984c'
yellow      = '#90604f'
blue        = '#5986b6'
magenta     = '#8b5b82'
cyan        = '#5ca8a5'
white       = '#4f5b66'

# Bright colors
[colors.bright]
black       = '#a7adba'
red         = '#c85863'
green       = '#6f984c'
yellow      = '#ebcb8b'
blue        = '#5986b6'
magenta     = '#8b5b82'
cyan        = '#5ca8a5'
white       = '#2b303b'
