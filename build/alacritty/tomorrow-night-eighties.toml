# Default colors
[colors.primary]
background  = '#2d2d2d'
foreground  = '#cccccc'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#2d2d2d'
cursor      = '#cccccc'

# Selection colors
[colors.selection]
background  = '#cccccc'
text        = '#2d2d2d'

# Normal colors
[colors.normal]
black       = '#393939'
red         = '#f2777a'
green       = '#99cc99'
yellow      = '#a3685a'
blue        = '#6699cc'
magenta     = '#cc99cc'
cyan        = '#66cccc'
white       = '#cccccc'

# Bright colors
[colors.bright]
black       = '#999999'
red         = '#f5989a'
green       = '#b1d8b1'
yellow      = '#ffcc66'
blue        = '#7da8d4'
magenta     = '#d8b1d8'
cyan        = '#7dd4d4'
white       = '#ffffff'
