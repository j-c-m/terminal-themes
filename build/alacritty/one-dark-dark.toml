# Theme:    One Dark Dark
# Mode:     dark
# Source:   One Dark (https://github.com/nathanbuchar/atom-one-dark-terminal)

# Default colors
[colors.primary]
background  = '#1e2127'
foreground  = '#abb2bf'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#1e2127'
red         = '#e06c75'
green       = '#98c379'
yellow      = '#d19a66'
blue        = '#61afef'
magenta     = '#c678dd'
cyan        = '#56b6c2'
white       = '#abb2bf'

# Bright colors
[colors.bright]
black       = '#5c6370'
red         = '#e06c75'
green       = '#98c379'
yellow      = '#d19a66'
blue        = '#61afef'
magenta     = '#c678dd'
cyan        = '#56b6c2'
white       = '#ffffff'
