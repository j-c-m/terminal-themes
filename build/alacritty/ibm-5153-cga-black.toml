# Theme:    IBM 5153 CGA Black
# Mode:     dark
# Source:   int10h.org (https://int10h.org/blog/2022/06/ibm-5153-color-true-cga-palette/)

# Default colors
[colors.primary]
background  = '#000000'
foreground  = '#c4c4c4'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#000000'
cursor      = '#c4c4c4'

# Selection colors
[colors.selection]
background  = '#c4c4c4'
text        = '#000000'

# Normal colors
[colors.normal]
black       = '#000000'
red         = '#c40000'
green       = '#00c400'
yellow      = '#c47e00'
blue        = '#0000c4'
magenta     = '#c400c4'
cyan        = '#00c4c4'
white       = '#c4c4c4'

# Bright colors
[colors.bright]
black       = '#4e4e4e'
red         = '#dc4e4e'
green       = '#4edc4e'
yellow      = '#f3f34e'
blue        = '#4e4edc'
magenta     = '#f34ef3'
cyan        = '#4ef3f3'
white       = '#ffffff'
