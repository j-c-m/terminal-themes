# Theme:    Kanagawa Dragon
# Mode:     dark
# Source:   Kanagawa (https://github.com/rebelot/kanagawa)

# Default colors
[colors.primary]
background  = '#181616'
foreground  = '#c5c9c5'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#181616'
cursor      = '#c5c9c5'

# Selection colors
[colors.selection]
background  = '#2d4f67'
text        = '#c8c093'

# Normal colors
[colors.normal]
black       = '#0d0c0c'
red         = '#c4746e'
green       = '#8a9a7b'
yellow      = '#c4b28a'
blue        = '#8ba4b0'
magenta     = '#a292a3'
cyan        = '#8ea4a2'
white       = '#c8c093'

# Bright colors
[colors.bright]
black       = '#a6a69c'
red         = '#e46876'
green       = '#87a987'
yellow      = '#e6c384'
blue        = '#7fb4ca'
magenta     = '#938aa9'
cyan        = '#7aa89f'
white       = '#c5c9c5'
