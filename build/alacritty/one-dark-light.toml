# Theme:    One Dark Light
# Mode:     light
# Source:   One Dark (https://github.com/nathanbuchar/atom-one-dark-terminal)
# License:  ISC

# Default colors
[colors.primary]
background  = '#f9f9f9'
foreground  = '#383a42'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#f9f9f9'
cursor      = '#383a42'

# Selection colors
[colors.selection]
background  = '#383a42'
text        = '#f9f9f9'

# Normal colors
[colors.normal]
black       = '#000000'
red         = '#e45649'
green       = '#50a14f'
yellow      = '#986801'
blue        = '#4078f2'
magenta     = '#a626a4'
cyan        = '#0184bc'
white       = '#a0a1a7'

# Bright colors
[colors.bright]
black       = '#383a42'
red         = '#e86e63'
green       = '#5bae5a'
yellow      = '#a77201'
blue        = '#5d8cf4'
magenta     = '#b72ab4'
cyan        = '#0191cf'
white       = '#ffffff'
