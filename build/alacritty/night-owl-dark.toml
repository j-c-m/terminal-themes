# Theme:    Night Owl Dark
# Mode:     dark
# Source:   Sarah Drasner (https://github.com/sdras/night-owl-vscode-theme)

# Default colors
[colors.primary]
background  = '#011627'
foreground  = '#d6deeb'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#011627'
red         = '#ef5350'
green       = '#22da6e'
yellow      = '#c5e478'
blue        = '#82aaff'
magenta     = '#c792ea'
cyan        = '#21c7a8'
white       = '#ffffff'

# Bright colors
[colors.bright]
black       = '#575656'
red         = '#ef5350'
green       = '#22da6e'
yellow      = '#ffeb95'
blue        = '#82aaff'
magenta     = '#c792ea'
cyan        = '#7fdbca'
white       = '#ffffff'
