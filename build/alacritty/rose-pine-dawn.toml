# Theme:    Rose Pine Dawn
# Mode:     light
# Source:   Rose Pine (https://github.com/rose-pine)

# Default colors
[colors.primary]
background  = '#faf4ed'
foreground  = '#575279'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#575279'
cursor      = '#cecacd'

# Selection colors
[colors.selection]
background  = '#dfdad9'
text        = '#575279'

# Normal colors
[colors.normal]
black       = '#f2e9e1'
red         = '#b4637a'
green       = '#286983'
yellow      = '#ea9d34'
blue        = '#56949f'
magenta     = '#907aa9'
cyan        = '#d7827e'
white       = '#575279'

# Bright colors
[colors.bright]
black       = '#9893a5'
red         = '#bd768a'
green       = '#2c7490'
yellow      = '#edaa4e'
blue        = '#63a0ab'
magenta     = '#9f8cb4'
cyan        = '#df9b98'
white       = '#575279'
