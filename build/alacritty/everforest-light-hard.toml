# Theme:    Everforest Light Hard
# Mode:     light
# Source:   Everforest (https://github.com/sainnhe/everforest)
# License:  MIT

# Default colors
[colors.primary]
background  = '#fffbef'
foreground  = '#5c6a72'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#fffbef'
cursor      = '#d3c6aa'

# Selection colors
[colors.selection]
background  = '#5c6a72'
text        = '#fffbef'

# Normal colors
[colors.normal]
black       = '#fffbef'
red         = '#f85552'
green       = '#8da101'
yellow      = '#dfa000'
blue        = '#3a94c5'
magenta     = '#df69ba'
cyan        = '#35a77c'
white       = '#5c6a72'

# Bright colors
[colors.bright]
black       = '#a6b0a0'
red         = '#f97472'
green       = '#9bb101'
yellow      = '#f5b000'
blue        = '#4e9fcb'
magenta     = '#e584c6'
cyan        = '#3ab888'
white       = '#272e33'
