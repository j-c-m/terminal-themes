# Theme:    Dayfox
# Mode:     light
# Source:   Eden East (https://github.com/EdenEast/nightfox.nvim)

# Default colors
[colors.primary]
background  = '#f6f2ee'
foreground  = '#3d2b5a'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#f6f2ee'
cursor      = '#3d2b5a'

# Selection colors
[colors.selection]
background  = '#e7d2be'
text        = '#3d2b5a'

# Normal colors
[colors.normal]
black       = '#352c24'
red         = '#a5222f'
green       = '#396847'
yellow      = '#ac5402'
blue        = '#2848a9'
magenta     = '#6e33ce'
cyan        = '#287980'
white       = '#f2e9e1'

# Bright colors
[colors.bright]
black       = '#534c45'
red         = '#b3434e'
green       = '#577f63'
yellow      = '#b86e28'
blue        = '#4863b6'
magenta     = '#8452d5'
cyan        = '#488d93'
white       = '#f4ece6'
