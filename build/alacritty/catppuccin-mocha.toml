# Theme:    Catppuccin Mocha
# Mode:     dark
# Source:   https://github.com/catppuccin/palette/blob/main/palette.json

# Default colors
[colors.primary]
background  = '#1e1e2e'
foreground  = '#cdd6f4'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#45475a'
red         = '#f38ba8'
green       = '#a6e3a1'
yellow      = '#f9e2af'
blue        = '#89b4fa'
magenta     = '#f5c2e7'
cyan        = '#94e2d5'
white       = '#a6adc8'

# Bright colors
[colors.bright]
black       = '#585b70'
red         = '#f37799'
green       = '#89d88b'
yellow      = '#ebd391'
blue        = '#74a8fc'
magenta     = '#f2aede'
cyan        = '#6bd7ca'
white       = '#bac2de'
