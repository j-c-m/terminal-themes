# Default colors
[colors.primary]
background  = '#2d2d2d'
foreground  = '#d3d0c8'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#393939'
red         = '#f2777a'
green       = '#99cc99'
yellow      = '#d27b53'
blue        = '#6699cc'
magenta     = '#cc99cc'
cyan        = '#66cccc'
white       = '#d3d0c8'

# Bright colors
[colors.bright]
black       = '#747369'
red         = '#f2777a'
green       = '#99cc99'
yellow      = '#ffcc66'
blue        = '#6699cc'
magenta     = '#cc99cc'
cyan        = '#66cccc'
white       = '#f2f0ec'
