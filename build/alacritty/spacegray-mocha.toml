# Theme:    Spacegray Mocha
# Mode:     dark
# Source:   Spacegray (https://github.com/SublimeText/Spacegray/)

# Default colors
[colors.primary]
background  = '#3b3228'
foreground  = '#d0c8c6'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#3b3228'
cursor      = '#d0c8c6'

# Selection colors
[colors.selection]
background  = '#d0c8c6'
text        = '#3b3228'

# Normal colors
[colors.normal]
black       = '#534636'
red         = '#cb6077'
green       = '#beb55b'
yellow      = '#bb9584'
blue        = '#8ab3b5'
magenta     = '#a89bb9'
cyan        = '#7bbda4'
white       = '#d0c8c6'

# Bright colors
[colors.bright]
black       = '#7e705a'
red         = '#d2778a'
green       = '#c6be6f'
yellow      = '#f4bc87'
blue        = '#9ec0c1'
magenta     = '#b9afc7'
cyan        = '#90c7b2'
white       = '#f5eeeb'
