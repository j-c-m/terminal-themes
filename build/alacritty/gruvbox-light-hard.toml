# Theme:    Gruvbox Light Hard
# Mode:     light
# Source:   https://github.com/morhetz/gruvbox-contrib/blob/master/color.table

# Default colors
[colors.primary]
background  = '#f9f5d7'
foreground  = '#3c3836'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#f9f5d7'
red         = '#cc241d'
green       = '#98971a'
yellow      = '#d79921'
blue        = '#458588'
magenta     = '#b16286'
cyan        = '#689d6a'
white       = '#7c6f64'

# Bright colors
[colors.bright]
black       = '#928374'
red         = '#9d0006'
green       = '#79740e'
yellow      = '#b57614'
blue        = '#076678'
magenta     = '#8f3f71'
cyan        = '#427b58'
white       = '#3c3836'
