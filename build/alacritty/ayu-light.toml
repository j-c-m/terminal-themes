# Theme:    Ayu Light
# Mode:     light
# Source:   Ayu Theme (https://github.com/ayu-theme)
# License:  MIT

# Default colors
[colors.primary]
background  = '#f8f9fa'
foreground  = '#5c6166'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#f8f9fa'
cursor      = '#ffaa33'

# Selection colors
[colors.selection]
background  = '#035bd6'
text        = '#f8f9fa'

# Normal colors
[colors.normal]
black       = '#000000'
red         = '#ea6c6d'
green       = '#6cbf43'
yellow      = '#eca944'
blue        = '#3199e1'
magenta     = '#9e75c7'
cyan        = '#46ba94'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f07171'
green       = '#86b300'
yellow      = '#f2ae49'
blue        = '#399ee6'
magenta     = '#a37acc'
cyan        = '#4cbf99'
white       = '#d1d1d1'
