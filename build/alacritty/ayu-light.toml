# Theme:    Ayu Light
# Mode:     light
# Source:   https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-dark.json https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-light.json

# Default colors
[colors.primary]
background  = '#f8f9fa'
foreground  = '#5c6166'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#000000'
red         = '#f06b6c'
green       = '#6cbf43'
yellow      = '#e7a100'
blue        = '#21a1e2'
magenta     = '#a176cb'
cyan        = '#4abc96'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f07171'
green       = '#86b300'
yellow      = '#eba400'
blue        = '#22a4e6'
magenta     = '#a37acc'
cyan        = '#4cbf99'
white       = '#d1d1d1'
