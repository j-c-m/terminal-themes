# Theme:    Ayu Mirage
# Mode:     dark
# Source:   https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-mirage.json

# Default colors
[colors.primary]
background  = '#1f2430'
foreground  = '#cccac2'

[colors.cursor]
text        = 'CellBackground'
cursor      = 'CellForeground'

[colors.selection]
text        = 'CellBackground'
background  = 'CellForeground'

# Normal colors
[colors.normal]
black       = '#171b24'
red         = '#f28273'
green       = '#87d96c'
yellow      = '#fcca60'
blue        = '#6acdff'
magenta     = '#ddbbff'
cyan        = '#93e2c8'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f28779'
green       = '#d5ff80'
yellow      = '#ffcd66'
blue        = '#73d0ff'
magenta     = '#dfbfff'
cyan        = '#95e6cb'
white       = '#ffffff'
