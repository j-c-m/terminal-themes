# Theme:    Ayu Mirage
# Mode:     dark
# Source:   Ayu Theme (https://github.com/ayu-theme)

# Default colors
[colors.primary]
background  = '#1f2430'
foreground  = '#cccac2'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text        = '#1f2430'
cursor      = '#ffcc66'

# Selection colors
[colors.selection]
background  = '#409fff'
text        = '#1f2430'

# Normal colors
[colors.normal]
black       = '#171b24'
red         = '#ed8274'
green       = '#87d96c'
yellow      = '#facc6e'
blue        = '#6dcbfa'
magenta     = '#dabafa'
cyan        = '#90e1c6'
white       = '#c7c7c7'

# Bright colors
[colors.bright]
black       = '#686868'
red         = '#f28779'
green       = '#d5ff80'
yellow      = '#ffd173'
blue        = '#73d0ff'
magenta     = '#dfbfff'
cyan        = '#95e6cb'
white       = '#ffffff'
