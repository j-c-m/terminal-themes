name: "Dracula"
modifier: "" # (optional: default blank)
source: "Dracula (https://draculatheme.com/)"
# Terminal colors adapted from the Ghostty Dracula formula
# Cursor, selection and primary colors taken from the provided palette.

dark:
  foreground: "#f8f8f2"
  background: "#282a36"
  cursor: "#f8f8f2"               # (optional: default foreground)
  cursor-text: "#282a36"          # (optional: default background)
  selection-foreground: "#f8f8f2" # (optional: default background)
  selection-background: "#44475a" # (optional: default foreground)
  colors:
    normal:
      black:   "#21222c"
      red:     "#ff5555"
      green:   "#50fa7b"
      yellow:  "#f1fa8c"
      blue:    "#bd93f9"
      magenta: "#ff79c6"
      cyan:    "#8be9fd"
      white:   "#f8f8f2"
    bright:
      black:   "#6272a4"
      red:     "#ff6e6e"
      green:   "#69ff94"
      yellow:  "#ffffa5"
      blue:    "#d6acff"
      magenta: "#ff92df"
      cyan:    "#a4ffff"
      white:   "#ffffff"
