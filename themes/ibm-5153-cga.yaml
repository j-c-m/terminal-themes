name: IBM 5153 CGA
source: "int10h.org (https://int10h.org/blog/2022/06/ibm-5153-color-true-cga-palette/)"
# 8% brightness increase 0-7 to simulate brightness on monitor
dark:
  foreground: '#cecece'
  background: '#141414'
  cursor: '#cecece'
  cursor-text: '#141414'
  selection-background: '#cecece'
  selection-foreground: '#141414'
  colors:
    normal:
      black: '#141414'
      red: '#d03333'
      green: '#1bd01b'
      yellow: '#d08c1b'
      blue: '#1b1bd0'
      magenta: '#d01bd0'
      cyan: '#1bd0d0'
      white: '#cecece'
    bright:
      black: '#4e4e4e'
      red: '#dc4e4e'
      green: '#4edc4e'
      yellow: '#f3f34e'
      blue: '#4e4edc'
      magenta: '#f34ef3'
      cyan: '#4ef3f3'
      white: '#ffffff'
