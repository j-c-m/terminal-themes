name: "Gruvbox"
modifier: "Medium"
source: "Gruvbox (https://github.com/morhetz/gruvbox)"

# Medium variant with both dark and light modes.
# Uses bg0 / fg0 convention for medium modifier.

dark:
  foreground: "#ebdbb2"
  background: "#282828"
  cursor: "#ebdbb2"
  colors:
    normal:
      black:   "#282828"
      red:     "#cc241d"
      green:   "#98971a"
      yellow:  "#d79921"
      blue:    "#458588"
      magenta: "#b16286"
      cyan:    "#689d6a"
      white:   "#d5c4a1" #fg2
    bright:
      black:   "#928374"
      red:     "#fb4934"
      green:   "#b8bb26"
      yellow:  "#fabd2f"
      blue:    "#83a598"
      magenta: "#d3869b"
      cyan:    "#8ec07c"
      white:   "#ebdbb2"

light:
  foreground: "#3c3836"
  background: "#fbf1c7"
  cursor: "#3c3836"
  colors:
    normal:
      black:   "#fbf1c7"
      red:     "#cc241d"
      green:   "#98971a"
      yellow:  "#d79921"
      blue:    "#458588"
      magenta: "#b16286"
      cyan:    "#689d6a"
      white:   "#504945"
    bright:
      black:   "#928374"
      red:     "#9d0006"
      green:   "#79740e"
      yellow:  "#b57614"
      blue:    "#076678"
      magenta: "#8f3f71"
      cyan:    "#427b58"
      white:   "#3c3836"
