name: Eighties
modifier: "Black"
source: Chris Kempson (http://chriskempson.com)
license: MIT
# bg #000000, fg #cccccc, bright black #888888; ANSI 0 near bg; normals darker/more saturated
dark:
  foreground: '#cccccc'
  background: '#000000'
  cursor: '#cccccc'
  colors:
    normal:
      black: '#111111'
      red: '#ee4549'
      green: '#59b259'
      yellow: '#c86131'
      blue: '#3773af'
      magenta: '#b259b2'
      cyan: '#37afaf'
      white: '#cccccc'
    bright:
      black: '#888888'
      red: '#f2777a'
      green: '#99cc99'
      yellow: '#ffcc66'
      blue: '#6699cc'
      magenta: '#cc99cc'
      cyan: '#66cccc'
      white: '#f2f0ec'
