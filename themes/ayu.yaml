name: "Ayu"
modifier: "" # (optional: default blank)
# the modifier can be used to specify a variant of the theme
# for example "hard" or "soft", if soft was specified
# the final name would end up being "Ayu Light Soft"

source: "https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-dark.json https://github.com/ayu-theme/vscode-ayu/blob/master/ayu-light.json"
license: MIT

dark:
  foreground: "#bfbdb6"
  background: "#0d1017"
  cursor: "#e6b450"
  cursor-text: "#0d1017"
  selection-foreground: "#0d1017"
  selection-background: "#3388ff"
  colors:
    normal:
      black: "#1b1f29"
      red: "#f06b73"
      green: "#70bf56"
      yellow: "#fdb04c"
      blue: "#4fbfff"
      magenta: "#d0a1ff"
      cyan: "#93e2c8"
      white: "#c7c7c7"
    bright:
      black: "#686868"
      red: "#f07178"
      green: "#aad94c"
      yellow: "#ffb454"
      blue: "#59c2ff"
      magenta: "#d2a6ff"
      cyan: "#95e6cb"
      white: "#ffffff"

light:
  foreground: "#5c6166"
  background: "#f8f9fa"
  cursor: "#f29718"
  cursor-text: "#f8f9fa"
  selection-foreground: "#f8f9fa"
  selection-background: "#035bd6"
  colors:
    normal:
      black: "#000000"
      red: "#f06b6c"
      green: "#6cbf43"
      yellow: "#e7a100"
      blue: "#21a1e2"
      magenta: "#a176cb"
      cyan: "#4abc96"
      white: "#c7c7c7"
    bright:
      black: "#686868"
      red: "#f07171"
      green: "#86b300"
      yellow: "#eba400"
      blue: "#22a4e6"
      magenta: "#a37acc"
      cyan: "#4cbf99"
      white: "#d1d1d1"
