name: "Ayu"
modifier: "" # (optional: default blank)
# the modifier can be used to specify a variant of the theme
# for example "hard" or "soft", if soft was specified
# the final name would end up being "Ayu Light Soft"

source: "Ayu Theme (https://github.com/ayu-theme)"
# include as much source information as possible in the comment
# you should try to source directly from the original truth if possible
# terminal colors sourced from vscode terminal.*
# selection background sourced from vscode selection.background
# cursor color sourced from vscode cursor.color

dark:
  foreground: "#bfbdb6"
  background: "#0b0e14"
  cursor: "#e6b450"               # (optional: default foreground)
  cursor-text: "#0b0e14"          # (optional: default background)
  selection-foreground: "#0b0e14" # (optional: default background)
  selection-background: "#409fff" # (optional: default foreground)
  colors:
    normal:
      black: "#11151c"
      red: "#ea6c73"
      green: "#7fd962"
      yellow: "#f9af4f"
      blue: "#53bdfa"
      magenta: "#cda1fa"
      cyan: "#90e1c6"
      white: "#c7c7c7"
    bright:
      black: "#686868"
      red: "#f07178"
      green: "#aad94c"
      yellow: "#ffb454"
      blue: "#59c2ff"
      magenta: "#d2a6ff"
      cyan: "#95e6cb"
      white: "#ffffff"

light:
  foreground: "#5c6166"
  background: "#f8f9fa"
  cursor: "#ffaa33"               # (optional: default foreground)
  cursor-text: "#f8f9fa"          # (optional: default background)
  selection-foreground: "#f8f9fa" # (optional: default background)
  selection-background: "#035bd6" # (optional: default foreground)
  colors:
    normal:
      black: "#000000"
      red: "#ea6c6d"
      green: "#6cbf43"
      yellow: "#eca944"
      blue: "#3199e1"
      magenta: "#9e75c7"
      cyan: "#46ba94"
      white: "#c7c7c7"
    bright:
      black: "#686868"
      red: "#f07171"
      green: "#86b300"
      yellow: "#f2ae49"
      blue: "#399ee6"
      magenta: "#a37acc"
      cyan: "#4cbf99"
      white: "#d1d1d1"