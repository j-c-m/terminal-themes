name: "Kanagawa Wave"
source: "Kanagawa (https://github.com/rebelot/kanagawa)"

dark:
  foreground: "#dcd7ba"
  background: "#1f1f28"
  cursor: "#dcd7ba"
  cursor-text: "#1f1f28"
  selection-background: "#2d4f67"
  selection-foreground: "#c8c093"
  colors:
    normal:
      black:   "#090618"
      red:     "#c34043"
      green:   "#76946a"
      yellow:  "#c0a36e"
      blue:    "#7e9cd8"
      magenta: "#957fb8"
      cyan:    "#6a9589"
      white:   "#c8c093"
    bright:
      black:   "#727169"
      red:     "#e82424"
      green:   "#98bb6c"
      yellow:  "#e6c384"
      blue:    "#7fb4ca"
      magenta: "#938aa9"
      cyan:    "#7aa89f"
      white:   "#dcd7ba"
